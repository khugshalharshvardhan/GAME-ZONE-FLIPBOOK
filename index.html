<!DOCTYPE html>
<!--
  ============================================================================
  FLIPBOOK TEMPLATE  —  interactive 3D storybook
  ----------------------------------------------------------------------------
  • No build step, no frameworks. Just open this file in any modern browser.
  • A real 3D hardcover book: thickness, a spine, a soft shadow. Tap PLAY to
    open it (the cover swings on the spine), then flip through the pages.

  ►  TO MAKE YOUR OWN STORY, edit ONLY:
        story.js      → your pages, scenes, dialogues, cover + music
        assets/       → your scene images/videos + cover art
        sfx/          → your background music
     Everything in  engine/  (book design, flip physics, buttons) stays as-is.
     See README.md for the step-by-step.
  ============================================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Flipbook</title>

<!-- ── Google Fonts: Fredoka (headings) + Poppins (dialogue text — LXD rule)
     + Patrick Hand (body default).
     Caveat was dropped: its only users were the placeholder bookplate / end-note
     rules, which are gone — one less font file to fetch. ── -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Patrick+Hand&family=Poppins:wght@600;700&display=swap"
  rel="stylesheet"
/>

<!-- Book styling / theme (engine — do not edit) -->
<link rel="stylesheet" href="engine/styles.css" />

<!-- ============================================================================
     BOOK-DROP ENTRANCE  —  project-level override, deliberately kept OUT of
     engine/ so it can be removed without touching the engine.
     On load the book falls towards the reader's surface: it starts large (close
     to the camera) and scales down over ~1.15s, lands with a small cartoon
     squash-and-settle, and a ring of dust puffs bursts out from under its edges
     at the impact moment — densest along the bottom edge.
     TO REVERT: delete this <style> block and the .dust-burst markup below.
     ============================================================================ -->
<style>
  /* ---- PURPLE WOOD SURFACE -------------------------------------------------
     The book lies on a wooden surface, but in the arcade's own colours rather
     than natural timber. assets/wood-purple.webp is the supplied plank art with
     every object removed, desaturated, then re-mapped across a violet ramp — so
     the grain and plank seams are the original ones, only the hue is the theme's.
     A vignette settles the outer edges so the book stays the focus. */
  body {
    background:
      radial-gradient(125% 95% at 50% 45%,
        rgba(0, 0, 0, 0) 40%, rgba(8, 3, 24, 0.28) 76%, rgba(5, 2, 16, 0.55) 100%),
      url("assets/wood-purple.webp") center / cover no-repeat fixed,
      #1c1038;                       /* plank tone, shown before the art paints */
  }

  /* ---- ARCADE AMBIENCE -----------------------------------------------------
     Layered OVER the purple planks: neon light pools, a retro perspective floor
     grid, and slowly drifting arcade glyphs in the GAME ZONE palette, so the
     surround still reads as the arcade the story is set in.
     Purely decorative: no assets, pointer-events:none, behind the book. */
  .arcade-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .scene     { position: relative; z-index: 1; }   /* keep the book above the ambience */

  /* Neon light pools bleeding in from the edges. */
  .arcade-bg::before {
    content: ""; position: absolute; inset: -10%;
    background:
      radial-gradient(38% 30% at 12% 16%, rgba(255, 64, 196, 0.16), transparent 70%),
      radial-gradient(34% 28% at 88% 14%, rgba(64, 208, 255, 0.14), transparent 70%),
      radial-gradient(30% 26% at 92% 78%, rgba(255, 176, 45, 0.10), transparent 72%),
      radial-gradient(46% 34% at 50% 104%, rgba(150, 80, 255, 0.22), transparent 70%);
  }
  /* Retro arcade floor: a grid laid flat in perspective along the bottom edge,
     faded out as it recedes so it never competes with the book. */
  .arcade-bg .grid {
    position: absolute; left: -25%; right: -25%; bottom: 0; height: 34%;
    background:
      repeating-linear-gradient(90deg, rgba(186, 130, 255, 0.20) 0 2px, transparent 2px 88px),
      repeating-linear-gradient(0deg,  rgba(186, 130, 255, 0.16) 0 2px, transparent 2px 48px);
    transform: perspective(420px) rotateX(62deg);
    transform-origin: bottom center;
    -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 92%);
            mask-image: linear-gradient(to top, #000 0%, transparent 92%);
  }
  /* Arcade glyphs drifting in the dark, echoing the symbols on the cover's floor. */
  .arcade-bg i {
    position: absolute; left: var(--gx); top: var(--gy);
    font-size: var(--gs); line-height: 1; font-style: normal;
    color: var(--gc); opacity: 0.22;
    text-shadow: 0 0 10px currentColor, 0 0 24px currentColor;
    animation: glyphDrift var(--gt, 14s) ease-in-out var(--gd, 0s) infinite;
  }
  @keyframes glyphDrift {
    0%, 100% { transform: translateY(0)     rotate(0deg); opacity: 0.16; }
    50%      { transform: translateY(-22px) rotate(8deg); opacity: 0.32; }
  }

  /* The whole book (cover + pages + frame) rides on .book-stage, which the engine
     leaves untransformed — so animating it moves everything together and settles
     back to identity, leaving the cover-open hinge free to run afterwards. */
  .book-stage { animation: bookDrop 1150ms both; }
  @keyframes bookDrop {
    /* falling: accelerate downward, oversized because it is nearer the camera */
    0%   { opacity: 0; transform: translateY(-17%) scale(1.62, 1.62);
           animation-timing-function: cubic-bezier(0.5, 0, 0.9, 0.45); }
    14%  { opacity: 1; }
    /* impact */
    52%  { transform: translateY(0) scale(1, 1);
           animation-timing-function: cubic-bezier(0.25, 0, 0.3, 1); }
    /* squash → rebound → settle (kept as scale(x,y) throughout so the
       interpolation stays smooth instead of snapping between function lists) */
    62%  { transform: translateY(0) scale(1.055, 0.925); }
    74%  { transform: translateY(0) scale(0.985, 1.035); }
    85%  { transform: translateY(0) scale(1.008, 0.99); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  /* Hold the engine's idle float until the book has actually landed. */
  .book-float { animation-delay: 1200ms; }

  /* ---- Dust ring -----------------------------------------------------------
     Sits in the book's fixed 1280x720 space as a sibling of .book-stage, so the
     puffs are NOT dragged along by the drop/squash transform above.
     Per-puff: --x/--y start point, --dx/--dy outward drift, --s size,
     --j delay jitter. */
  .dust-burst { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
  .dust-burst i {
    position: absolute; display: block;
    left: var(--x); top: var(--y);
    width: var(--s); height: var(--s); margin: calc(var(--s) / -2);
    border-radius: 50%;
    background: radial-gradient(circle at 42% 38%,
      rgba(255,255,255,0.50) 0%, rgba(214,206,240,0.26) 55%, rgba(196,188,228,0) 72%);
    opacity: 0;
    animation: dustPuff 900ms ease-out both;
    animation-delay: calc(600ms + var(--j));   /* 600ms ≈ the 52% impact frame */
  }
  @keyframes dustPuff {
    0%   { opacity: 0;    transform: translate(0, 0) scale(0.35); }
    18%  { opacity: 0.8; }
    100% { opacity: 0;    transform: translate(var(--dx), var(--dy)) scale(1.9); }
  }

  /* No entrance for readers who prefer less motion — the book is simply there. */
  @media (prefers-reduced-motion: reduce) {
    .book-stage { animation: none; }
    .book-float { animation-delay: 0s; }
    .dust-burst { display: none; }
    .arcade-bg i { animation: none; }     /* glyphs stay, they just stop drifting */
  }
</style>
</head>

<body>
<!-- Landscape lock: on phones/tablets (touch), the book shows only in landscape.
     In portrait the scene is hidden and this rotate prompt is shown instead. -->
<div class="rotate-notice" id="rotateNotice">
  <div class="rotate-inner">
    <svg class="rotate-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="currentColor" d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
    </svg>
    <div class="rotate-text">Please rotate your device<br />to landscape to read</div>
  </div>
</div>
<!-- Arcade ambience behind the book: neon light pools, a retro perspective floor
     grid, and drifting arcade glyphs in the GAME ZONE palette. Decorative only.
     (Styles live in the <style> block in <head>; delete both to remove.) -->
<div class="arcade-bg" aria-hidden="true">
  <span class="grid"></span>
  <!-- The book fills most of the viewport, so the glyphs live in the visible
       frame AROUND it: the thin top/bottom strips and the left/right margins. -->
  <i style="--gx:2.5%; --gy:6%;  --gs:30px; --gc:#ff58d8; --gt:15s; --gd:0s">●</i>
  <i style="--gx:2%;   --gy:44%; --gs:24px; --gc:#4fd8ff; --gt:12s; --gd:1.6s">▲</i>
  <i style="--gx:4%;   --gy:88%; --gs:20px; --gc:#ffc23d; --gt:17s; --gd:3.1s">★</i>
  <i style="--gx:96%;  --gy:8%;  --gs:26px; --gc:#4fd8ff; --gt:13s; --gd:0.8s">◆</i>
  <i style="--gx:97%;  --gy:47%; --gs:22px; --gc:#ff58d8; --gt:16s; --gd:2.4s">★</i>
  <i style="--gx:94%;  --gy:90%; --gs:18px; --gc:#b07cff; --gt:14s; --gd:4.2s">●</i>
  <i style="--gx:22%;  --gy:2.5%;--gs:18px; --gc:#b07cff; --gt:18s; --gd:2.0s">▲</i>
  <i style="--gx:74%;  --gy:3%;  --gs:20px; --gc:#ffc23d; --gt:15s; --gd:5.0s">◆</i>
  <i style="--gx:34%;  --gy:93%; --gs:18px; --gc:#4fd8ff; --gt:16s; --gd:1.1s">★</i>
  <i style="--gx:63%;  --gy:94%; --gs:22px; --gc:#ff58d8; --gt:13s; --gd:3.6s">●</i>
</div>

<div class="scene">
  <div class="stage">
    <!-- Fixed 1280×720 book layer. JS scales it (transform) to fit the screen. -->
    <div class="flip-scale" id="flipScale">
    <!-- INNER scale wrapper: the open motion runs here, so it composes with the
         outer responsive scale of .flip-scale. -->
    <div class="book-stage" id="bookStage">
    <!-- Outer hardcover outline — visible once the book is open -->
    <div class="book-frame"></div>
    <div class="floor-shadow"></div>

    <!-- The page-turning book mounts here (JS injects one .leaf per page).
         Sits beneath the 3D cover layer; revealed once the cover swings open.
         .page-stack = the tan fore-edge of the pages still to be turned (right). -->
    <div id="flipbook">
      <div class="page-stack" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>

    <!-- Moving shadow the opening cover casts on the inside page. -->
    <div class="cover-cast"></div>

    <!-- The 3D hardcover + cover-opening animation (own perspective layer). -->
    <div class="cover-scene" id="coverScene">
    <div class="book-float" id="bookFloat">
      <div class="book-pop" id="bookPop">
        <div class="book" id="book">
          <div class="book-inner" id="bookInner">

            <!-- Open-book back cover backing -->
            <div class="book-body"></div>

            <!-- The 3D page block that gives the closed book its thickness.
                 pb-pages / pb-back-lip = the flat "book anatomy" of the closed
                 front view: the page stack peeking out UNDER the front cover,
                 resting on the back-cover lip (they fade out as the book opens). -->
            <div class="pageblock">
              <div class="pbf pb-back"></div>
              <div class="pbf pb-left"></div>
              <div class="pbf pb-right"></div>
              <div class="pbf pb-top"></div>
              <div class="pbf pb-bottom"></div>
              <div class="pbf pb-front"></div>
              <div class="pb-back-lip" aria-hidden="true"></div>
              <div class="pb-pages" aria-hidden="true"></div>
            </div>
            <!-- Front hardcover (last so it stacks in front when closed). -->
            <div class="cover-holder">
            <div class="cover" id="cover">
              <div class="face front">
                <div class="cover-img"></div>
                <!-- Ornate GOLD cover frame (corner filigree + edge stars + double
                     rule). One SVG in book-space (1280×720) so it scales crisply
                     with the book — makes the closed cover read as a bound storybook. -->
                <svg class="cover-frame" viewBox="0 0 1280 720" aria-hidden="true">
                  <!-- A single clean thin gold rule frames the cover — the busy
                       corner filigree, edge stars and corner brackets were
                       removed to keep the cover simple and uncluttered. -->
                  <rect x="44" y="44" width="1192" height="632" rx="8" fill="none"
                        stroke="#f4d67f" stroke-width="2.2" opacity="0.85"/>
                </svg>
                <div class="back-fill"></div>
                <div class="curl"></div>
                <!-- PLAY button — the supplied orange play-orb artwork
                     (assets/play-button.webp, trimmed from assets/PLAY BUTTON (2).png).
                     The art carries the whole look, so the button itself is just the
                     image: no border, no fill, no glyph. Styling in styles.css. -->
                <button class="play-btn" id="hint" type="button" aria-label="Play — open the book"></button>
              </div>
              <!-- BACK of the front cover: intentionally BLANK (plain dark board). -->
              <div class="face back"></div>
            </div>
            </div><!-- /cover-holder -->

          </div>
        </div>
      </div>
    </div>
    </div><!-- /cover-scene -->

    <!-- Flat, top-most, transparent tap zone that only OPENS the book. -->
    <div class="tap-catcher" id="tapCatcher"></div>

    <!-- (THE END is now a real final PAGE — the last leaf, built by script.js:
         a cream "paper" page with "THE END" + a Replay button. Replay closes the
         whole book, reverse of the opening swing, back to the front cover.) -->
    </div><!-- /book-stage -->

    <!-- Dust kicked up where the book meets the surface. Sibling of .book-stage
         so the landing squash does not drag the puffs with it. Coordinates are
         book space (1280x720): the bottom edge is y≈700, the sides x≈40/1240.
         Densest along the bottom, a few at the lower corners fanning outward.
         (Part of the BOOK-DROP ENTRANCE — see the <style> block in <head>.) -->
    <div class="dust-burst" aria-hidden="true">
      <!-- bottom edge, left → right -->
      <i style="--x:180px;  --y:702px; --dx:-54px; --dy:-26px; --s:64px;  --j:0ms"></i>
      <i style="--x:280px;  --y:708px; --dx:-30px; --dy:-38px; --s:52px;  --j:40ms"></i>
      <i style="--x:390px;  --y:704px; --dx:-14px; --dy:-30px; --s:74px;  --j:15ms"></i>
      <i style="--x:500px;  --y:710px; --dx: -6px; --dy:-42px; --s:58px;  --j:70ms"></i>
      <i style="--x:610px;  --y:706px; --dx:  4px; --dy:-34px; --s:80px;  --j:25ms"></i>
      <i style="--x:720px;  --y:710px; --dx: 10px; --dy:-44px; --s:56px;  --j:60ms"></i>
      <i style="--x:830px;  --y:704px; --dx: 18px; --dy:-30px; --s:72px;  --j:10ms"></i>
      <i style="--x:940px;  --y:708px; --dx: 34px; --dy:-36px; --s:54px;  --j:50ms"></i>
      <i style="--x:1050px; --y:702px; --dx: 58px; --dy:-24px; --s:62px;  --j:30ms"></i>
      <!-- lower corners, fanning out sideways -->
      <i style="--x:70px;   --y:686px; --dx:-86px; --dy:-18px; --s:70px;  --j:55ms"></i>
      <i style="--x:1200px; --y:686px; --dx: 88px; --dy:-18px; --s:70px;  --j:45ms"></i>
      <!-- a couple riding a little higher up the sides -->
      <i style="--x:96px;   --y:610px; --dx:-70px; --dy:-46px; --s:46px;  --j:110ms"></i>
      <i style="--x:1178px; --y:610px; --dx: 72px; --dy:-46px; --s:46px;  --j:95ms"></i>
      <!-- fine haze drifting up through the middle -->
      <i style="--x:460px;  --y:690px; --dx:-10px; --dy:-88px; --s:34px;  --j:150ms"></i>
      <i style="--x:800px;  --y:690px; --dx: 14px; --dy:-92px; --s:34px;  --j:170ms"></i>
    </div>
    </div><!-- /flip-scale -->
  </div>
</div>

<!-- LBD GAME OVERLAY — the interactive games (Game-Zone-LBD1/2/3) embedded as
     pages of the book. The live game is a BODY-LEVEL iframe, not a child of the
     leaf: a leaf sits inside a CSS 3D transform, which would blur the game's text
     and trap any position:fixed inside it. JS parks this box exactly over the page
     rectangle so the game looks printed into the book, shows it only while an
     "lbd" page is the current one, and unloads it on leaving (which stops the
     game's own audio). The leaf itself shows a still poster underneath. -->
<div class="lbd-stage" id="lbdStage" aria-hidden="true">
  <iframe id="lbdFrame" title="Game Zone activity" allow="autoplay; fullscreen"></iframe>
</div>

<!-- ACTIVITY PROGRESS NOTICES — both sit ABOVE the game overlay (z600) and the
     corner arrows (z700), because both are about the game the reader is looking at.

     #leaveConfirm : asked before turning the page out of an activity the reader has
                     started but not finished. Leaving unloads the game, which resets
                     it to level 1, so this is the reader's only warning that their
                     progress is about to go. Buttons are wired in script.js.
     #replayNotice : a brief, non-blocking line shown when landing on an activity the
                     reader has already played, so a fresh title screen is not mistaken
                     for continuing where they left off. -->
<div class="leave-confirm" id="leaveConfirm" aria-hidden="true" role="dialog"
     aria-modal="true" aria-labelledby="leaveConfirmTitle">
  <div class="leave-confirm-card">
    <div class="leave-confirm-title" id="leaveConfirmTitle">Leave this activity?</div>
    <div class="leave-confirm-body">You&rsquo;ll start it from the beginning next time.</div>
    <div class="leave-confirm-actions">
      <button class="lc-btn lc-stay" id="leaveStay"  type="button">Stay</button>
      <button class="lc-btn lc-go"   id="leaveGo"    type="button">Leave</button>
    </div>
  </div>
</div>

<div class="replay-notice" id="replayNotice" aria-hidden="true" role="status">
  <span>Starting from the beginning</span>
</div>

<!-- Flip arrows OUTSIDE the book, fixed at the viewport's bottom corners
     (bottom-left = back, bottom-right = forward). -->
<button class="corner-arrow back" id="cornerPrev" aria-label="Previous page">
  <svg viewBox="0 0 48 48" aria-hidden="true">
    <path d="M46 19 L30 5 L30 12 C20 11 11 15 6 30 L12 33 C18 24 22 24 30 24 L30 33 Z" fill="currentColor"/>
  </svg>
</button>
<button class="corner-arrow fwd" id="cornerNext" aria-label="Next page">
  <svg viewBox="0 0 48 48" aria-hidden="true">
    <path d="M46 19 L30 5 L30 12 C20 11 11 15 6 30 L12 33 C18 24 22 24 30 24 L30 33 Z" fill="currentColor"/>
  </svg>
</button>

<!-- (legacy hidden nav elements kept only so existing JS refs stay valid) -->
<button class="arrow prev" id="prev" aria-label="Previous page">‹</button>
<button class="arrow next" id="next" aria-label="Next page">›</button>

<!-- GSAP (local copy, works on file://) — drives the physical page-flip motion:
     lift → gravity fall → tiny landing bounce. If this file fails to load, the
     book automatically falls back to the original CSS-transition flip. -->
<script src="engine/gsap.min.js"></script>
<!-- Inlined one-shot SFX (base64) for glitch-free Web Audio playback on file:// -->
<script src="engine/sfx-data.js"></script>
<!-- ►  YOUR STORY (pages, dialogues, cover, music) — edit this file -->
<script src="story.js"></script>
<!-- The flip engine (reads window.STORY) — do not edit -->
<script src="engine/script.js"></script>
</body>
</html>
